services:
  backend:
    build:
      context: ./backend
    container_name: resumeai-backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      PORT: 5000
      NODE_ENV: production

    ports:
      - "5000:5000"

  frontend:
    build:
      context: ./frontend
    container_name: resumeai-frontend
    restart: unless-stopped

    ports:
      - "8080:80"

    depends_on:
      - backend

   